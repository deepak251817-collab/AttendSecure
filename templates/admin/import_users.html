{% extends "base.html" %}
{% block title %}Import Users{% endblock %}
{% block content %}
<h2 class="mb-3"><i class="fas fa-file-import me-2"></i>Bulk Import Users</h2>
<div class="card" style="max-width: 640px;">
  <div class="card-body">
    <p class="text-muted">
      Upload a CSV or Excel file with the columns:
      <code>username, role, password, class_id, section_id</code>
      (the last two are only used for students).
    </p>
    <form method="POST" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <input type="file" name="file" class="form-control" accept=".csv,.xls,.xlsx" required>
      </div>
      <button type="submit" class="btn btn-primary">Import</button>
      <a href="{{ url_for('admin.users') }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
