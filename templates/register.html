<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <h1>Register</h1>
    <form method="POST">
        <input type="text" name="username" placeholder="Enter Username" required><br><br>
        <input type="password" name="password" placeholder="Enter Password" required><br><br>
        <select name="role" required>
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="admin">Admin</option>
        </select><br><br>

        <!-- Conditional fields for student role -->
        <div id="class-section-fields" style="display:none;">
            <input type="text" name="class_name" placeholder="Enter Class" required><br><br>
            <input type="text" name="section" placeholder="Enter Section" required><br><br>
        </div>

        <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>

    <script>
        const roleSelect = document.querySelector('select[name="role"]');
        const classSectionFields = document.getElementById('class-section-fields');

        roleSelect.addEventListener('change', function() {
            if (this.value === 'student') {
                classSectionFields.style.display = 'block';
            } else {
                classSectionFields.style.display = 'none';
            }
        });
    </script>
</body>
</html>
