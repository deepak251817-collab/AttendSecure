<!DOCTYPE html>
<html>
<head>
    <title>My Attendance</title>
</head>
<body>
    <h1>My Attendance</h1>
    <table border="1">
        <tr>
            <th>Date</th>
            <th>Status</th>
        </tr>
        {% for record in attendance_records %}
        <tr>
            <td>{{ record.date }}</td>
            <td>{{ record.status }}</td>
        </tr>
        {% endfor %}
    </table>
    <a href="/dashboard">
    <button type="button">Go to Dashboard</button>
</a>
</body>
</html>
