{% macro stat_card(icon, color, label, value) %}
<div class="col-6 col-md-4 col-lg">
  <div class="card stat-card">
    <div class="card-body d-flex align-items-center gap-3">
      <div class="icon" style="background: {{ color }}">
        <i class="fas {{ icon }}"></i>
      </div>
      <div>
        <div class="fs-4 fw-bold">{{ value }}</div>
        <div class="text-muted small">{{ label }}</div>
      </div>
    </div>
  </div>
</div>
{% endmacro %}

{% macro filter_form(subjects, pairs, f, action=None) %}
<form class="row g-2 align-items-end mb-3" method="get" action="{{ action or request.path }}">
  <div class="col-md-3">
    <label class="form-label small mb-0">Section</label>
    <select name="section_id" class="form-select form-select-sm">
      <option value="">All sections</option>
      {% for p in pairs %}
      <option value="{{ p.section_id }}" {{ 'selected' if f.get('section_id') == p.section_id }}>{{ p.label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label small mb-0">Subject</label>
    <select name="subject_id" class="form-select form-select-sm">
      <option value="">All subjects</option>
      {% for s in subjects %}
      <option value="{{ s.subject_id }}" {{ 'selected' if f.get('subject_id') == s.subject_id }}>{{ s.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-2">
    <label class="form-label small mb-0">From</label>
    <input type="date" name="start_date" class="form-control form-control-sm" value="{{ f.get('start_date') or '' }}">
  </div>
  <div class="col-md-2">
    <label class="form-label small mb-0">To</label>
    <input type="date" name="end_date" class="form-control form-control-sm" value="{{ f.get('end_date') or '' }}">
  </div>
  <div class="col-md-2 d-grid">
    <button class="btn btn-primary btn-sm" type="submit"><i class="fas fa-filter me-1"></i> Apply</button>
  </div>
</form>
{% endmacro %}
